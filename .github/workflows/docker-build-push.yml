name: Deploy Logic to RunPod S3 and Build Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- Stage 1: Deploy Logic (Fast) ---
  deploy-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Boto3
        run: pip install boto3

      - name: Deploy to RunPod S3
        env:
          S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
          S3_ENDPOINT: "https://s3api-us-il-1.runpod.io"
          S3_BUCKET: "3d-scans"
        run: python scripts/deploy_to_s3.py

  # --- Stage 2: Build Docker (Only if needed) ---
  build-and-push:
    runs-on: ubuntu-latest
    # ตั้งค่าให้รันเฉพาะเมื่อไฟล์ Docker หรือ loader เปลี่ยน
    if: |
      contains(github.event.head_commit.modified, 'Dockerfile') ||
      contains(github.event.head_commit.modified, 'loader.py')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Processor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.colmap
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/3dscan-worker:processor
          cache-from: type=gha
          cache-to: type=gha,mode=max
