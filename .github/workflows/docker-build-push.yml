name: Build and Push to GHCR and Deploy Logic

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- Stage 1: Build & Push to GHCR (Base Environment) ---
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Loader Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.minimal
          push: true
          # อิมเมจตัวจิ๋วที่จะเริ่มงานในวินาทีเดียว
          tags: ghcr.io/prida-takon/3dscan-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Stage 2: Deploy Logic to S3 (Fast Backup) ---
  deploy-logic:
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Boto3
        run: pip install boto3
      - name: Deploy to RunPod S3
        env:
          S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
          S3_ENDPOINT: "https://s3api-us-il-1.runpod.io"
          S3_BUCKET: "53kzs49kuf"
        run: python scripts/deploy_to_s3.py
