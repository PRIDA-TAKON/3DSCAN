name: Build and Push Modular 3D Scan Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Step 1: Build & Push Processor (COLMAP) ---
      - name: Build and Push Processor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.colmap
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/3dscan-worker:processor
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Step 2: Build & Push Trainer (Nerfstudio) ---
      - name: Build and Push Trainer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nerfstudio
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/3dscan-worker:trainer
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Processor Image: ${{ secrets.DOCKERHUB_USERNAME }}/3dscan-worker:processor"
          echo "✅ Trainer Image: ${{ secrets.DOCKERHUB_USERNAME }}/3dscan-worker:trainer"
